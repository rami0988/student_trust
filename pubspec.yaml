name: mobile_template
description: "A reusable Flutter starter template."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  app_links: ^7.2.1
  better_player_plus: ^1.0.8
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  built_value: ">=8.11.0 <9.0.0"
  cached_network_image_ce: ^4.9.0
  collection: ^1.19.1
  connectivity_plus: ^7.3.0
  country_code_picker: ^3.4.1
  crypto: ^3.0.6
  cupertino_icons: ^1.0.9
  device_info_plus: ^13.2.0
  dio: ^5.10.0
  dropdown_search: ^7.0.0
  encrypt: ^5.0.3
  equatable: ^2.1.0
  event_bus: ^2.0.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  # NOTE(migration): flutter_jailbreak_detection removed — its android/build.gradle
  # predates namespace support and fails to configure under AGP 9 (used by this
  # project). Not yet referenced by any code (root/jailbreak detection for the
  # AuthGate is task #16, not built yet). Re-add with a maintained alternative
  # when building that gate.
  flutter_local_notifications: ^22.2.0
  flutter_localizations:
    sdk: flutter
  flutter_pdfview: ^1.3.2
  flutter_secure_storage: ^10.3.1
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.3.0
  get_it: ">=8.0.0 <10.0.0"
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  injectable: ">=2.6.0 <4.0.0"
  intl: ^0.20.2
  json_annotation: ">=4.9.0 <5.0.0"
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  pinput: ^6.0.2
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ">=2.4.0 <3.0.0"
  built_value_generator: ">=8.9.0 <9.0.0"
  json_serializable: ">=6.8.0 <7.0.0"
  injectable_generator: ">=2.4.0 <4.0.0"
  bloc_test: ">=9.1.0 <11.0.0"
  flutter_native_splash: ^2.4.7
  intl_utils: ">=2.8.0 <3.0.0"
  mockito: ">=5.4.0 <6.0.0"
  hive_ce_generator: ">=1.8.0 <2.0.0"
  # Used by test/features/downloads/encrypted_download_service_test.dart to
  # point path_provider at a temp dir (there is no platform impl under
  # `flutter test`). Both are transitive deps of path_provider already;
  # declared here to satisfy depend_on_referenced_packages.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal_extra_light.ttf
          weight: 200
        - asset: assets/fonts/tajawal_light.ttf
          weight: 300
        - asset: assets/fonts/tajawal_regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal_medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal_bold.ttf
          weight: 700
        - asset: assets/fonts/tajawal_extra_bold.ttf
          weight: 800
        - asset: assets/fonts/tajawal_black.ttf
          weight: 900

    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo_extra_light.ttf
          weight: 200
        - asset: assets/fonts/cairo_light.ttf
          weight: 300
        - asset: assets/fonts/cairo_regular.ttf
          weight: 400
        - asset: assets/fonts/cairo_medium.ttf
          weight: 500
        - asset: assets/fonts/cairo_semi_bold.ttf
          weight: 600
        - asset: assets/fonts/cairo_bold.ttf
          weight: 700
        - asset: assets/fonts/cairo_extra_bold.ttf
          weight: 800
        - asset: assets/fonts/cairo_black.ttf
          weight: 900

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/branding/

# Used by the "Flutter Assets" IDE plugin to (re)generate lib/generated/assets.dart.
flutter_assets:
  assets_path: assets/
  output_path: lib/generated/
  filename: assets.dart
  field_prefix: null

flutter_intl:
  enabled: true
dependency_overrides:
  jni: 1.0.0

