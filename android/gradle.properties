org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin is deliberately OFF. AGP 9 can compile Kotlin without the
# Kotlin Gradle Plugin, but this flag is project-wide: enabling it also forbids
# KGP in *plugin* modules, and several dependencies (app_links,
# better_player_plus, …) still apply `org.jetbrains.kotlin.android` and fail to
# configure. Flutter's "migrate to Built-in Kotlin" warning is therefore not
# actionable yet — re-check once those plugins ship migrated versions.
# See CLAUDE.md ("Android / Gradle").
android.builtInKotlin=false
